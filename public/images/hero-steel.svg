<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1824"/>
      <stop offset="45%" stop-color="#141618"/>
      <stop offset="100%" stop-color="#22262b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0d6dc"/>
      <stop offset="45%" stop-color="#8a9199"/>
      <stop offset="100%" stop-color="#4a525a"/>
    </linearGradient>
    <linearGradient id="glow" x1="70%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#e85d04" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e85d04" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1200" cy="320" rx="420" ry="280" fill="url(#glow)"/>
  <g opacity="0.55" transform="translate(900,80) rotate(-28)">
    <rect x="40" y="40" width="18" height="720" rx="9" fill="url(#bar)"/>
    <rect x="90" y="20" width="14" height="760" rx="7" fill="url(#bar)"/>
    <rect x="130" y="60" width="16" height="700" rx="8" fill="url(#bar)"/>
    <rect x="175" y="10" width="20" height="780" rx="10" fill="url(#bar)"/>
    <rect x="220" y="50" width="13" height="720" rx="6" fill="url(#bar)"/>
    <rect x="260" y="30" width="17" height="740" rx="8" fill="url(#bar)"/>
    <rect x="305" y="70" width="15" height="690" rx="7" fill="url(#bar)"/>
    <rect x="350" y="25" width="19" height="750" rx="9" fill="url(#bar)"/>
  </g>
  <ellipse cx="1180" cy="760" rx="280" ry="40" fill="#000" opacity="0.35" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#bg)" opacity="0.25"/>
</svg>
